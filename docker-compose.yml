version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/recordings:/app/recordings
      - ./server/database:/app/database
    networks:
      - classroom-lan
    restart: unless-stopped

  mediasoup-sfu:
    build:
      context: ./mediasoup-sfu
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    networks:
      - classroom-lan
    restart: unless-stopped
    profiles:
      - sfu

networks:
  classroom-lan:
    driver: bridge
